name: Cintia Copy Final 2

on:
  push:
    branches:
      - cintia-copy-final-2
    paths:
      - 'scripts/cintia_copy_final_2.py'
      - '.github/workflows/cintia-copy-final-2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar headline aprovada
        run: python scripts/cintia_copy_final_2.py
      - name: Validar texto
        run: |
          grep -q 'Clareza jurídica para decisões que não admitem respostas genéricas' index.html
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "content: ajusta headline das áreas de atuação"
          git push
