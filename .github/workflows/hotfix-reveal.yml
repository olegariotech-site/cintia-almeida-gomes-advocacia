name: Hotfix reveal visibility

on:
  push:
    paths:
      - '.github/workflows/hotfix-reveal.yml'

permissions:
  contents: write

jobs:
  fix-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Corrigir erro de sintaxe do scroll
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          broken = "p=max>0:y/max*100:0"
          fixed = "p=max>0?y/max*100:0"
          if broken not in s:
              raise SystemExit('Trecho quebrado não encontrado; hotfix não aplicado.')
          p.write_text(s.replace(broken, fixed, 1), encoding='utf-8')
      - name: Commit do hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: corrige sintaxe do reveal no scroll"
          git push
