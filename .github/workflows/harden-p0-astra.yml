name: Harden P0 Astra

on:
  push:
    paths:
      - 'scripts/harden_p0_astra.py'
      - '.github/workflows/harden-p0-astra.yml'

permissions:
  contents: write

jobs:
  harden-p0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar hardening P0
        run: python scripts/harden_p0_astra.py
      - name: Validar JS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/site.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/site.js
      - name: Validar invariantes
        run: |
          grep -q "join(String.fromCharCode(10))" index.html
          grep -q 'method="post"' index.html
          ! grep -q '<video class="hero-video" autoplay' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: endurece formulario e video apos auditoria Astra"
          git push
