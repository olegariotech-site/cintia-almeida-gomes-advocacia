name: OT add office location

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ot-add-office-location.yml'
      - '.github/ot_add_location.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply location patch
        run: python .github/ot_add_location.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add office address and Google Maps links'
          git push
