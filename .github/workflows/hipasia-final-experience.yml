name: Hipasia Final Hero Experience

on:
  push:
    branches:
      - hipasia-final-hero-experience
    paths:
      - 'scripts/hipasia_final_experience.py'
      - '.github/workflows/hipasia-final-experience.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajuste final do hero e hovers
        run: python scripts/hipasia_final_experience.py
      - name: Validar JS
        run: node --check site.js
      - name: Validar invariantes
        run: |
          grep -q 'HIPASIA FINAL HERO EXPERIENCE' styles.css
          grep -q 'object-fit: contain' styles.css
          grep -q 'transform: translateY(-6px) scale(1.004)' styles.css
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "feat: integra assinatura ao hero e reforca microinteracoes"
          git push
