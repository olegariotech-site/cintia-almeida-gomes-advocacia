name: Refine hero and contact links

on:
  push:
    paths:
      - 'scripts/refine_hero_and_links.py'
      - '.github/workflows/refine-hero-and-links.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar refinamentos
        run: python scripts/refine_hero_and_links.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: refina hero, WhatsApp e rodapé"
          git push
