name: Confirm official contact channels

on:
  push:
    paths:
      - '.github/workflows/confirm-contact.yml'

permissions:
  contents: write

jobs:
  update-contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar WhatsApp e Instagram confirmados
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          contact = '''<section class="contact" id="contato"><div class="wrap contact-grid"><div class="reveal"><span class="label">Contato</span><h2 class="title">Dê o primeiro passo com clareza</h2><p class="sub">O primeiro contato serve para apresentar brevemente sua solicitação e não substitui consulta jurídica individualizada.</p><div class="contact-card" style="margin-top:24px"><h3>Canais oficiais</h3><p><strong>WhatsApp:</strong> (19) 99880-8725<br><strong>E-mail:</strong> cintiapalmeida@adv.oabsp.org.br<br><strong>Atendimento presencial:</strong> Valinhos/SP e região de Campinas<br><strong>Atendimento online:</strong> todo o Brasil<br><strong>Horário noturno:</strong> mediante disponibilidade, até 21h</p><div class="social"><a class="js-wa" target="_blank" rel="noopener noreferrer">WhatsApp</a><a href="mailto:cintiapalmeida@adv.oabsp.org.br">E-mail</a><a href="https://www.instagram.com/cintiap.almeida?utm_source=qr&amp;igsh=bW0zMzU2emk2azdz" target="_blank" rel="noopener noreferrer">Instagram</a><a href="https://www.linkedin.com/in/cintia-almeida-gomes-768b401a3" target="_blank" rel="noopener noreferrer">LinkedIn</a></div></div></div><form class="form contact-card reveal" id="contactForm"><h3>Solicitar atendimento</h3><div class="field"><label for="nome">Nome</label><input id="nome" name="nome" type="text" autocomplete="name" required></div><div class="field"><label for="telefone">Telefone / WhatsApp</label><input id="telefone" name="telefone" type="tel" autocomplete="tel" required></div><div class="field"><label for="area">Área relacionada</label><select id="area" name="area" required><option value="">Selecione</option><option>Direito de Família</option><option>Direito Imobiliário / Locações / Condomínio</option><option>Direito Civil / Contratos</option><option>Direito do Consumidor</option><option>Outro assunto</option></select></div><div class="field"><label for="mensagem">Breve resumo</label><textarea id="mensagem" name="mensagem" required></textarea></div><small>As informações preenchidas serão usadas para montar uma mensagem e abrir o WhatsApp. O site não armazena esses dados.</small><div class="form-status" id="status" aria-live="polite"></div><button class="btn gold" type="submit">Continuar no WhatsApp</button></form></div></section>'''
          s, n = re.subn(r'<section class="contact" id="contato">.*?</section>\n</main>', contact + '\n</main>', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Seção de contato não encontrada')

          if '.float{' not in s:
              s = s.replace('footer{background:', '.float{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#25d366;border:2px solid rgba(255,255,255,.72);box-shadow:0 14px 34px rgba(0,0,0,.28);z-index:110;transition:transform .25s ease}.float:hover{transform:translateY(-3px) scale(1.03)}.float img{width:28px;height:28px}footer{background:', 1)

          s = s.replace('cintiapalmeida@adv.oabsp.org.br</p></div>', 'cintiapalmeida@adv.oabsp.org.br<br>WhatsApp: (19) 99880-8725</p></div>', 1)

          float_html = '<a class="float js-wa" target="_blank" rel="noopener noreferrer" aria-label="Solicitar atendimento pelo WhatsApp"><img src="whatsapp.svg" alt=""></a>\n'
          if 'class="float js-wa"' not in s:
              s = s.replace('<script>\n', float_html + '<script>\n', 1)

          script = r'''<script>
(()=>{
  const root=document.documentElement,top=document.getElementById('top'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const waBase='https://wa.me/5519998808725?text=';
  const defaultMsg='Olá, Dra. Cíntia. Vim pelo site e gostaria de solicitar atendimento jurídico.';
  document.querySelectorAll('.js-wa').forEach(a=>a.href=waBase+encodeURIComponent(defaultMsg));
  addEventListener('pointermove',e=>{root.style.setProperty('--mx',e.clientX+'px');root.style.setProperty('--my',e.clientY+'px')},{passive:true});
  const scroll=()=>{const y=scrollY,max=document.documentElement.scrollHeight-innerHeight,p=max>0?y/max*100:0;root.style.setProperty('--scroll',p+'%');top.classList.toggle('scrolled',y>20);if(!reduce){root.style.setProperty('--hero-y',Math.min(y*.08,58)+'px');root.style.setProperty('--orbit-y',Math.min(y*.04,42)+'px');root.style.setProperty('--orbit-r',Math.min(y*.012,13)+'deg');root.style.setProperty('--card-y',Math.min(y*.025,22)+'px')}};
  addEventListener('scroll',scroll,{passive:true});scroll();
  const reveals=document.querySelectorAll('.reveal');
  addEventListener('error',()=>root.classList.remove('motion-ready'));
  if(!reduce&&'IntersectionObserver'in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target)}}),{threshold:.12,rootMargin:'0px 0px -8% 0px'});root.classList.add('motion-ready');reveals.forEach(e=>io.observe(e))}else reveals.forEach(e=>e.classList.add('on'));
  if('IntersectionObserver'in window){const stepIO=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('active',e.isIntersecting)),{threshold:.55});document.querySelectorAll('.step').forEach(e=>stepIO.observe(e))}
  document.querySelectorAll('.area,.faq-item').forEach(el=>el.addEventListener('toggle',()=>{if(el.open){const group=el.classList.contains('area')?'.area':'.faq-item';document.querySelectorAll(group).forEach(o=>{if(o!==el)o.open=false})}}));
  const toggle=document.getElementById('toggle'),nav=document.getElementById('nav');
  if(toggle&&nav){toggle.addEventListener('click',()=>{const open=nav.classList.toggle('open');toggle.setAttribute('aria-expanded',open)});nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{nav.classList.remove('open');toggle.setAttribute('aria-expanded','false')}))}
  const form=document.getElementById('contactForm'),status=document.getElementById('status');
  if(form){form.addEventListener('submit',e=>{e.preventDefault();if(!form.checkValidity()){form.reportValidity();return}const d=new FormData(form),body=['Olá, Dra. Cíntia. Vim pelo site e gostaria de solicitar atendimento jurídico.','','Nome: '+d.get('nome'),'Telefone/WhatsApp: '+d.get('telefone'),'Área: '+d.get('area'),'Resumo: '+d.get('mensagem')].join('\n');status.textContent='Abrindo o WhatsApp com sua mensagem preenchida.';window.open(waBase+encodeURIComponent(body),'_blank','noopener,noreferrer')})}
})();
</script>'''
          s, n = re.subn(r'<script>.*?</script>', script, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Script principal não encontrado')

          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: confirma WhatsApp e Instagram oficiais"
          git push
