name: Apply Signature Motion V2

on:
  push:
    paths:
      - 'scripts/apply_signature_motion_v2.py'
      - '.github/workflows/apply-signature-motion-v2.yml'

permissions:
  contents: write

jobs:
  apply-motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar motion premium
        run: python scripts/apply_signature_motion_v2.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: adiciona Signature Motion V2 aos cards e frase de impacto"
          git push
