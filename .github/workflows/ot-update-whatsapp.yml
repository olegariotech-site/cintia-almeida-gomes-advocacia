name: OT update Cintia WhatsApp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ot-update-whatsapp.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old WhatsApp number
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          replacements = {
              '5519998808725': '5519996837596',
              '(19) 99880-8725': '(19) 99683-7596',
          }
          for name in ['index.html', 'site.js']:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')
          PY
          ! grep -R --line-number -E '5519998808725|\(19\) 99880-8725' index.html site.js
          grep -R --line-number -E '5519996837596|\(19\) 99683-7596' index.html site.js
      - name: Commit WhatsApp update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html site.js
          git diff --cached --quiet && exit 0
          git commit -m 'Update Cintia WhatsApp number'
          git push
