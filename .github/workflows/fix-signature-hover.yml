name: Fix Signature Motion hover

on:
  push:
    paths:
      - 'scripts/fix_signature_hover.py'
      - '.github/workflows/fix-signature-hover.yml'

permissions:
  contents: write

jobs:
  fix-hover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar hover
        run: python scripts/fix_signature_hover.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: preserva hover após animação dos cards"
          git push
