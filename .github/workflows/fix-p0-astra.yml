name: Fix P0 Astra

on:
  push:
    paths:
      - 'scripts/fix_p0_astra.py'
      - '.github/workflows/fix-p0-astra.yml'

permissions:
  contents: write

jobs:
  fix-p0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correções P0
        run: python scripts/fix_p0_astra.py
      - name: Validar sintaxe JavaScript embutida
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not blocks:
              raise SystemExit('Nenhum script encontrado')
          Path('/tmp/site.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/site.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: corrige P0 funcional e acessibilidade da auditoria Astra"
          git push
