name: Cintia V4 - smoke and browser QA

on:
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'site.js'
      - 'v4.css'
      - 'tests/v4-*.mjs'
      - '.github/workflows/cintia-v4-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v4-qa:
    name: Validate V4 responsive and contact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static smoke
        run: node tests/v4-smoke.mjs

      - name: Browser dependency (isolated to QA runner)
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.1

      - name: Confirm Chrome executable
        run: |
          which google-chrome
          google-chrome --version

      - name: Serve and test preview (localhost only)
        env:
          CHROME_BIN: /usr/bin/google-chrome
          SITE_URL: http://127.0.0.1:4173
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cintia-v4-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 2
          node tests/v4-browser.mjs

      - name: QA evidence - screenshots and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cintia-v4-qa-screenshots
          path: artifacts/v4/
          retention-days: 14
          if-no-files-found: warn
