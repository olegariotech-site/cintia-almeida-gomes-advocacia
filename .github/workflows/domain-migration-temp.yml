name: Domain migration temporary

on:
  push:
    branches: [main]
    paths:
      - 'scripts/domain_migration.py'
      - '.github/workflows/domain-migration-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update official domain references
        run: python scripts/domain_migration.py
      - name: Validate domain migration
        run: |
          grep -q 'https://cintiaalmeidaadvocacia.com.br/' index.html
          if grep -q 'https://olegariotech-site.github.io/cintia-almeida-gomes-advocacia/' index.html; then exit 1; fi
      - name: Commit domain migration
        run: |
          git config user.name "Olegario Tech"
          git config user.email "olegariotech.oficial@gmail.com"
          git add index.html
          git commit -m "seo: migra metadados para domínio oficial"
          git push
