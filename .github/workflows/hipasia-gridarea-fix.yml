name: Hipasia Hero Gridarea Fix

on:
  push:
    branches:
      - hipasia-final-hero-experience
    paths:
      - 'scripts/hipasia_gridarea_fix.py'
      - '.github/workflows/hipasia-gridarea-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir grid-area da assinatura
        run: python scripts/hipasia_gridarea_fix.py
      - name: Validar
        run: |
          node --check site.js
          grep -q 'grid-area: auto' styles.css
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "fix: ancora assinatura ao hero sem area implicita de grid"
          git push
