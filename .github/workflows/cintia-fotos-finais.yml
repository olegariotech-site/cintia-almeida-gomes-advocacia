name: Cintia Fotos Finais

on:
  push:
    branches:
      - cintia-fotos-finais
    paths:
      - 'scripts/cintia_fotos_finais.py'
      - '.github/workflows/cintia-fotos-finais.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar fotos finais
        run: python scripts/cintia_fotos_finais.py
      - name: Validar referências
        run: |
          grep -q 'assetsdra-cintia-hero.png?v=20260908a' index.html
          grep -q 'assetsdra-cintia-sobre.png?v=20260908a' index.html
          test -f assetsdra-cintia-hero.png
          test -f assetsdra-cintia-sobre.png
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "content: aplica novas fotos da Cíntia no hero e sobre"
          git push
