name: Install consent banner temporary

on:
  push:
    branches: [main]
    paths:
      - 'scripts/consent_patch.py'
      - '.github/workflows/consent-banner-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply consent patch
        run: python scripts/consent_patch.py
      - name: Validate privacy install
        run: |
          grep -q 'id="cookieBanner"' index.html
          grep -q 'cintia_cookie_consent_v1' site.js
          grep -q 'GTM-TGGPH6PH' site.js
          grep -q 'Cookie consent — optional analytics' styles.css
          if grep -q 'googletagmanager.com/gtm.js?id=' index.html; then exit 1; fi
      - name: Commit privacy install
        run: |
          git config user.name "Olegario Tech"
          git config user.email "olegariotech.oficial@gmail.com"
          git add index.html styles.css site.js
          git commit -m "feat: adiciona consentimento de cookies antes do analytics"
          git push
